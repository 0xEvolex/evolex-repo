Roc: |-
  Description:
  Roc is a weekly unique boss event located in Roc Mountain.
  Defeat Roc and its stronger form, Deathbone, for valuable drops.

  Rewards:
  Roc Drops:
  10x random Wheel items.
  10x Gold Piles.
  10x Magic POP Cards.
  6x Premium Magic POP Cards.
  Roc Set equipment.
  Direct to inventory: 3x Wheel of Fates, 150 Sailor Points.

  Deathbone Drops:
  2x 14th Degree Magic items.
  3x 13th Degree Legend items.
  4x 13th Degree Rare items.
  1x tradeable 13th Degree Special Awaken Stone Weapon
  1x tradeable 13th Degree Special Awaken Stone Shield
  20x random Wheel items.
  16x Gold Piles.
  Trigger, Dodging & Hit Scrolls.
  10x Magic POP Cards.
  6x Premium Magic POP Cards.
  3x Random Exclusive 2017 Demon Shaitan Avatar parts.
  3x Random Exclusive 2017 Demon Shaitan Avatar parts.
  Direct to inventory: 3x Wheel of Fates, 150 Sailor Points.

  Requirements:
  Move to Gate of Ruler in Roc Mountain and purchase a key to enter its lair.
  Gate of Ruler is only open for a short period so be swift to enter.
Medusa: |-
  Description:
  Medusa is a unique boss that spawns periodically. Defeat her for rare Egyptian equipment and alchemy materials.

  Rewards:
  1x tradeable 13th Degree Special Awaken Stone.
  8x Gold Piles.
  50% chance to drop 1x random Rare Egyptian A-type equipment.
  10x Magic POP Cards.
  6x Premium Magic POP Cards.
  Drops also include 10th Degree related items such as SoX, Coupons, etc.
  Direct to inventory: 1x Wheel of Fate, 100 Silver Silks.

  Requirements:
  Enter the Gate of Sarin Tribe and defeat all her guardians to spawn Medusa.
  Gate of Sarin Tribe is only open for a short period so be swift to enter.
Moon Gem: |-
  Description:
  Every hour Event So-Ok NPC will give Moon Pots for 10 minutes (xx:50 till xx:00).
  You can get a random number of potions between 1 and 10.
  Collect Moon Gems by killing monsters - 1 pot + 10 Moon Gems = 1 reward.
  Note that Moon Gems can be used as Vigor Potions as well.

  How to participate:
  1. Speak to Event So-Ok NPC in any town.
  2. Hunt any monsters to get Moon Gems.

  Rewards:
  Black Moon rewards:
  Trigger, Dodging, Hit and SP Scrolls.
  Magic POP Cards, Pandora's Box, Berserker Potion.
  Evil Scented, Illusion, Life, Energy and Whirling Snow Flowers.

  Red Moon rewards:
  INT and STR Scrolls.
  Pandora's Box, Monster Summon Scroll, Instant Res Scroll.

  Requirements:
  Speak to Event So-Ok NPC in any town to receive Moon Pots during the event time.
Clash of the Gods: |-
  Description:
  The event features three Egyptian God uniques (Anput, Satis, and Wadjet) and Mummy elite monsters.
  Each Egyptian God unique kill grants 100 points to the player and their team.
  Each Mummy kill grants 2 points.
  Each enemy player kill grants 1 point.
  When 1st Anput spawns: 40 Mummy monsters also spawn in each team's zone.
  At 10 minutes left: 40 Mummy monsters spawn in the losing team's zone.
  At 5 minutes left: 40 Mummy monsters spawn in the losing team's zone.
  At 2 minutes left: 40 Mummy monsters spawn in the losing team's zone.

  Rewards:
  WIN: 10x Diamond Coins & 7x Coins of Courage.
  DEFEAT/DRAW: 6x Diamond Coins & 4x Coins of Courage.
  Unique drops (killer party members): 1x Wheel of Fate, 10 Silver Silks.
  All Mummy monsters: 15% chance to drop Wheel of Fate.

  Requirements:
  1900+ Item Points are required to register at the Arena Manager NPC.
Poison Temple: |-
  Description:
  Poison Temple is a job-only area where three uniques spawn simultaneously.
  You can find a unique on each of the circular platforms: North West, South West and South East.
  Use Tunnel of Abyss teleporters to enter (entrance is allowed only when uniques spawn).

  Rewards:
  Each unique drops:
  Chance to drop 14th Degree Magic Proof Stone.
  5x random Wheel items.
  6x Gold Piles.
  4x Magic POP Cards.
  3x Premium Magic POP Cards.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 5x Diamond Coins, 50 Sailor Points.

  Requirements:
  Must be wearing a job suit. Trader, hunter or thief (job-only area).
Sailors Clash: |-
  Description:
  A team-based PvP arena event. Loot boxes spawn at set intervals during the match.
  Box Spawn Times: 09:30 (right at start), 06:20, 03:10.

  Rewards:
  WIN: 10x Diamond Coins & 7x Coins of Courage.
  DEFEAT/DRAW: 6x Diamond Coins & 4x Coins of Courage.

  Requirements:
  1900+ Item Points are required to register at the Arena Manager NPC.
Unique Clash: |-
  Description:
  A team-based PvP arena event with unique monsters.

  Rewards:
  WIN: 10x Diamond Coins & 7x Coins of Courage.
  DEFEAT/DRAW: 6x Diamond Coins & 4x Coins of Courage.

  Requirements:
  1900+ Item Points are required to register at the Arena Manager NPC.
Styria Clash: |-
  Description:
  A job-themed team-based PvP arena event. Loot boxes spawn at set intervals during the match.
  Box Spawn Times: 09:30 (right at start), 06:20, 03:10.

  Rewards:
  WIN: 12x Diamond Coins & 7x Coins of Courage.
  DEFEAT/DRAW: 7x Diamond Coins & 4x Coins of Courage.

  Requirements:
  1850+ Item Points and an equipped Job Suit required to register at the Arena Manager NPC.
Carnage Arena: |-
  Description:
  A free-for-all PvP arena event. Earn bonus rewards for each kill.

  Rewards:
  WIN: 10x Diamond Coins & 2x Coins of Courage.
  KILL: 1x Coin of Courage (MAX 5).
  DEFEAT/DRAW: 7x Diamond Coins & 1x Coin of Courage.

  Requirements:
  1900+ Item Points are required to register at the Arena Manager NPC.
Carnage Party: |-
  Description:
  A team-based PvP arena event. Players are randomly assigned to a team (no party forming beforehand needed).
  Each team consists of 2x CH and 2x EU players.

  Rewards:
  WIN: 12x Diamond Coins & 10x Coins of Courage.
  DEFEAT/DRAW: 8x Diamond Coins & 7x Coins of Courage.

  Requirements:
  2100+ Item Points are required to register at the Arena Manager NPC.
Ghost Hunt: |-
  Description:
  A cooperative PvE event where players hunt ghost monsters using Talismans of Exorcism.
  Close any kind of movement speed buffs before the event starts, otherwise you can't attend!
  Buy Talismans of Exorcism from the Grocery Shop - you'll use these to kill mobs in the event.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  No movement speed buffs active when the event starts.
  Talismans of Exorcism required (Grocery Shop).
  1900+ Item Points are required to register at the So Ok NPC.
BA Random: |-
  Description:
  Battle Arena with random team assignment.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  No IP requirements as theres IP matchmaking.
BA Party: |-
  Description:
  Battle Arena where you enter with your own party.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  No IP requirements as theres IP matchmaking.
BA Guild: |-
  Description:
  Battle Arena where you enter with your guild.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  1950+ Item Points are required to enter.
  Guild Master or a deputy must register the members at the Arena Manager NPC.
BA Flag: |-
  Description:
  Battle Arena capture-the-flag mode.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  No IP requirements as theres IP matchmaking.
BA Job: |-
  Description:
  Battle Arena job-themed mode.

  Rewards:
  WIN: 8x Diamond Coins & 6x Coins of Courage.
  DEFEAT/DRAW: 5x Diamond Coins & 3x Coins of Courage.

  Requirements:
  No IP requirements as theres IP matchmaking.
SA Solo: |-
  Description:
  Solo Survival Arena. Each Season grants rewards for up to 40 games.
  This limit transfers to the next season.

  Rewards:
  WIN: 2x Diamond Coins & 6x Coins of Combativeness.
  KILL: 1x Diamond Coin.
  DEFEAT/DRAW: 1x Diamond Coin & 3x Coins of Combativeness.

  Requirements:
  2000+ Item Points are required to enter.
SA Party: |-
  Description:
  Party Survival Arena. Each Season grants rewards for up to 40 games.
  This limit does NOT transfer to the next season!

  Rewards:
  WIN: 4x Diamond Coins & 6x Coins of Combativeness.
  DEFEAT/DRAW: 2x Diamond Coins & 3x Coins of Combativeness.

  Requirements:
  2000+ Item Points are required to enter.
Anubis & Isis: |-
  Description:
  A job temple unique boss encounter.
  Job Temple entrance is located at Salt Post in Alexandria.

  Rewards:
  Chance to drop 14th Degree Magic Proof Stone.
  5x random Wheel items.
  6x Gold Piles.
  4x Magic POP Cards.
  3x Premium Magic POP Cards.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 5x Diamond Coins, 50 Sailor Points.

  Requirements:
  A job suite is required to enter the Job Temple.
Selket & Neith: |-
  Description:
  A job temple unique boss encounter.
  Job Temple entrance is located at Salt Post in Alexandria.

  Rewards:
  Chance to drop 14th Degree Magic Proof Stone.
  5x random Wheel items.
  6x Gold Piles.
  4x Magic POP Cards.
  3x Premium Magic POP Cards.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 5x Diamond Coins, 50 Sailor Points.

  Requirements:
  A job suite is required to enter the Job Temple.
Haroeris & Seth: |-
  Description:
  A job temple encounter with three shadow uniques of increasing difficulty.
  Job Temple entrance is located at Salt Post in Alexandria.

  Rewards:
  Shadow Eris Drops:
  Chance to drop 14th Degree Magic Proof Stone.
  3x random Wheel items.
  6x Gold Piles.
  4x Magic POP Cards.
  3x Premium Magic POP Cards.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 3x Diamond Coins, 30 Sailor Points.

  Shadow Haroeris Drops:
  Chance to drop 14th Degree Magic Proof Stone.
  6x random Wheel items.
  7x Gold Piles.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 6x Diamond Coins, 60 Sailor Points.

  Shadow Seth Drops:
  Chance to drop 14th Degree Magic Proof Stone.
  8x random Wheel items.
  8x Gold Piles.
  4x Magic POP Cards.
  3x Premium Magic POP Cards.
  Chance to drop 14th Degree Magic Equipment.
  Direct to inventory: 7x Diamond Coins, 70 Sailor Points.

  Requirements:
  A job suite is required to enter the Job Temple.
Fortress War: |-
  Description:
  Weekly guild-vs-guild siege event. Conquer a fortress to earn tax income from associated towns.
  Duration: 60 minutes.
  Registration remains available until 19:30 GMT+2.

  Available Fortresses:
  1. Hotan - Tax: Donwhang, Hotan, Alexandria & Baghdad.
  2. Constantinople - Tax: Constantinople & Samarkand.
  3. Bandit - Tax: Jangan.

  Rewards:
  Tax income from the towns associated with the conquered fortress.

  Requirements:
  Must be in a guild.
  Both Pick Pet & Fellow Pet must be terminated to teleport inside the fortress areas.
Capture the Flag: |-
  Description:
  A capture-the-flag PvP event exclusively for players with a level range of 60~120.

  Rewards:
  Win:
  1x 200% Experience Booster (2 hours).
  1x 200% Skill Experience Booster (2 hours).
  20x Ice Trophies.

  Defeat/Draw:
  1x 200% Experience Booster (1 hour).
  1x 200% Skill Experience Booster (1 hour).
  10x Ice Trophies.

  Ice Trophy exchange (10x Trophies = 1 reward at Event So-Ok):
  25% chance: Faded Bead.
  20% chance: Magic POP Card.
  15% chance: 11D Magic Stone Coupon.
  10% chance: 11D Attribute Stone Coupon.
  10% chance: Premium Magic POP Card.
  5% chance: 11D Weapon Elixir Coupon.
  5% chance: 11D Shield Elixir Coupon.
  5% chance: 11D Protector Elixir Coupon.
  5% chance: 11D Accessory Elixir Coupon.

  Requirements:
  Character level 60~120.
Special Trade (1 hour): |-
  Description:
  Special Trades are time-limited events where all special trade routes are enabled.
  For more information check out the jobbing guide on Sailor's website.

  Schedule / Durations:
  Every day at:
  02:00 - 03:00 GMT+2 (1 hour).
  15:00 - 16:00 GMT+2 (1 hour, 2h on Sunday).
  20:00 - 22:00 GMT+2 (2 hours, excluding Sundays).

  Rewards:
  Trade profits from special trade routes.

  Requirements:
  Must be a trader.
Special Trade (2 hours): |-
  Description:
  Special Trades are time-limited events where all special trade routes are enabled.
  For more information check out the jobbing guide on Sailor's website.

  Schedule / Durations:
  Every day at:
  02:00 - 03:00 GMT+2 (1 hour).
  15:00 - 16:00 GMT+2 (1 hour, 2h on Sunday).
  20:00 - 22:00 GMT+2 (2 hours, excluding Sundays).

  Rewards:
  Trade profits from special trade routes.

  Requirements:
  Must be a trader.
Fence Trade: |-
  Description:
  Fence Trades are Special Trades, but for thieves.
  They usually happen one hour after Special Trades.
  For more information check out the jobbing guide on Sailor's website.

  Schedule / Durations:
  Thu, Fri, Sat, Sun at:
  03:00 - 04:00 GMT+2 (1 hour).
  16:00 - 17:00 GMT+2 (1 hour).

  Rewards:
  Trade profits from fencing routes.

  Requirements:
  Thief level 13 or higher.
Calendar Reset: |-
  Description:
  Attendance Reward Calendar will reset and is ready to be claimed again.
  Take care, whenever the calendar ends you will be unable to claim the rewards anymore.

  Rewards:
  Daily attendance rewards from the calendar.

  Requirements:
  Can only be done once a day.
Genie Reset: |-
  Description:
  Genie Reset will reset the Genie Quest and the Genie Quest Manager.
  It's a daily quest designed to help you gear up your character.
  Take note that you might have to abandon quest if you outlevel it.

  Rewards:
  Lv 71-90: D11 Egy A and Egy B equipment.
  Lv 91-100: D11 Egy A, Egy B and D12 Magic equipment.
  Lv 101-110: D11 Egy A, Egy B and D12 Magic, Rare and Legend equipment.
  Lv 111-130: D12/D13 Magic, Rare and Legend equipment.

  Requirements:
  Can only be done once a day.
